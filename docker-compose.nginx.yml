# Variante para una VPS que ya tiene Nginx (deploy/README.md, "Con el Nginx de la VPS").
# No levanta Caddy y publica la app solo en 127.0.0.1, para que Nginx le haga de proxy:
#   docker compose -f docker-compose.prod.yml -f docker-compose.nginx.yml --env-file .env.production up -d --build

services:
  app:
    ports:
      # Solo local: desde afuera se entra únicamente por Nginx. Cambiar APP_PORT si
      # el puerto ya lo usa otra app de la VPS.
      - "127.0.0.1:${APP_PORT:-3010}:3000"

  proxy:
    # Caddy queda desactivado (solo arranca con --profile caddy).
    profiles: ["caddy"]
