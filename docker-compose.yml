# Entorno de desarrollo: solo la base de datos.
# La app corre en el host con `npm run dev`.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: biblioteca
      POSTGRES_PASSWORD: biblioteca
      POSTGRES_DB: biblioteca
    ports:
      # 5433 en el host para no chocar con un Postgres local en 5432
      - "5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U biblioteca -d biblioteca"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Worker de extracción de texto (pdftotext + OCR). No arranca con `npm run db:up`:
  #   docker compose --profile worker up -d --build worker
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    profiles: ["worker"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://biblioteca:biblioteca@db:5432/biblioteca
    # El modo de Drive sale del .env (links públicos por defecto). Si ahí se activa
    # DRIVE_LOCAL_DIR=./.drive-local, esta carpeta queda disponible en /app/.drive-local.
    volumes:
      - ./.drive-local:/app/.drive-local:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
