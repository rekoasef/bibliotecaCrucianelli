# Producción en la VPS de la empresa (docs/02, "Infraestructura").
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
# Ver deploy/README.md para el primer despliegue, el seed y la restauración de backups.

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-db-url: &db-url postgres://biblioteca:${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD}@db:5432/biblioteca

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: biblioteca
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: biblioteca
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U biblioteca -d biblioteca"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logging

  # Aplica las migraciones y termina; la app arranca después.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile.worker
    image: biblioteca-worker
    command: ["npx", "tsx", "src/db/migrate.ts"]
    # Con env_file también sirve para correr el seed (deploy/README.md).
    env_file: .env.production
    environment:
      DATABASE_URL: *db-url
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    logging: *logging

  app:
    build: .
    image: biblioteca-app
    restart: unless-stopped
    env_file: .env.production
    environment:
      DATABASE_URL: *db-url
    depends_on:
      migrate:
        condition: service_completed_successfully
    logging: *logging

  worker:
    image: biblioteca-worker
    restart: unless-stopped
    env_file: .env.production
    environment:
      DATABASE_URL: *db-url
    depends_on:
      migrate:
        condition: service_completed_successfully
    logging: *logging

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      DOMAIN: ${DOMAIN:?Falta DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app
    logging: *logging

  # pg_dump diario con retención (14 diarios + 8 semanales). Ver scripts/backup.sh.
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/scripts/backup.sh"]
    environment:
      PGHOST: db
      PGUSER: biblioteca
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: biblioteca
      TZ: America/Argentina/Buenos_Aires
      BACKUP_HOUR: ${BACKUP_HOUR:-4}
      # Comando opcional para copiar /backups fuera de la VPS (rclone, scp…).
      BACKUP_COPY_CMD: ${BACKUP_COPY_CMD:-}
    volumes:
      - ./scripts:/scripts:ro
      - ${BACKUP_DIR:-./backups}:/backups
    depends_on:
      db:
        condition: service_healthy
    logging: *logging

volumes:
  db-data:
  caddy-data:
  caddy-config:
